schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.

context: |
  Open Daycare es una red interna para guarderías: el personal publica en un feed
  (logros, actividades, avisos) y las familias consultan ese feed, el directorio y
  el perfil de cada niño. El objetivo es centralizar la comunicación entre la
  guardería y los padres en una sola app web, con login, invitación/activación de
  padres y roles.

